[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-mulvul"
version = "0.1.0"
description = "Calibrated dynamic routing and evidence-guided rerouting for MulVul-style detectors"
requires-python = ">=3.11"
dependencies = [
    "openai==2.8.1",
    "python-dotenv==1.1.1",
    "tree-sitter==0.26.0",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
retrieval = [
    "numpy>=1.26,<3",
    "torch>=2.2",
    "transformers>=4.40,<6",
    "faiss-cpu>=1.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["src"]

